[package]
name = "arctic-embed-s-int8"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Pure-Rust Int8 CPU inference engine for Snowflake/snowflake-arctic-embed-s (Linux & macOS; ARM64 SME/I8MM/DotProd/NEON, x86_64 AVX-VNNI/AVX2)"
repository = "https://github.com/mdlockyer/snowflake-arctic-embed-s-rust"
readme = "README.md"
keywords = ["embeddings", "bert", "int8", "inference", "simd"]
categories = ["science", "text-processing"]
# model/ (34 MB) exceeds the crates.io size limit; use the repository or a release artifact.
exclude = ["/model", "/weights", "/scripts", "/.github"]

[lib]
name = "arctic_embed_s_int8"
path = "src/lib.rs"

[[bin]]
name = "arctic-embed"
path = "src/bin/arctic_embed.rs"

[[bin]]
name = "arctic-embed-convert"
path = "src/bin/convert.rs"
required-features = ["convert"]

[features]
# safetensors import + SmoothQuant calibration, only needed to (re)build `model/model.ae8`.
convert = []

[dependencies]

[lints.clippy]
# Hand-tuned SIMD kernels: wide signatures, index-driven loops and full-precision polynomial
# coefficients are deliberate.
too_many_arguments = "allow"
needless_range_loop = "allow"
excessive_precision = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false

# CI: release optimizations without fat LTO / single codegen unit, which dominate CI build time.
# The crate has no dependencies, so LTO only affects inlining from std; results are unchanged.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

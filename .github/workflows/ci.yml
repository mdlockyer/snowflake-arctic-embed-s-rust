name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MODEL_CACHE_KEY: ae8-v1.0.0-d68b00ac

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu, aarch64-apple-darwin
      - run: cargo fmt --all --check
      - name: clippy (x86_64-unknown-linux-gnu)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (aarch64-unknown-linux-gnu)
        run: cargo clippy --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
      - name: clippy (aarch64-apple-darwin)
        run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache .ae8 model pack
        id: model
        uses: actions/cache@v4
        with:
          path: model/model.ae8
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Fetch .ae8 model pack
        run: scripts/fetch_model.sh
      - name: Host CPU features
        run: |
          if [ "$RUNNER_OS" = macOS ]; then sysctl -a | grep -E 'hw.optional.arm.FEAT_(DotProd|I8MM|SME)' || true
          else grep -m1 -E '^(flags|Features)' /proc/cpuinfo; fi
      - name: Build tests
        run: cargo test --profile ci --lib --bins --tests --no-run
      - name: Test
        run: cargo test --profile ci --lib --bins --tests
      - name: Benchmark (quick)
        run: |
          cargo run --profile ci --bin arctic-embed -- --quick | tee bench.txt
          { echo "### Benchmark (\`--quick\`, ${{ matrix.os }})"; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
